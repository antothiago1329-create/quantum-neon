<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Neon Terminal</title>
  <!-- Eruda Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <!-- React y Babel CDN para ejecutar JSX sin compilador -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background: #0b0f10; color: #00f3ff; font-family: monospace; }
    #root { display: flex; justify-content: center; align-items: center; height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    function App() {
      return (
        <div style={{ textAlign: 'center', padding: '20px' }}>
          <h1 style={{ color: '#00f3ff', textShadow: '0 0 10px #00f3ff' }}>Quantum Neon Terminal</h1>
          <p style={{ color: '#3fb950' }}>✓ Sistema cargado exitosamente en GitHub Pages</p>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
