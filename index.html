<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Neon Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .neon-glow {
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.5), 0 0 20px rgba(34, 211, 238, 0.3);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [authCode, setAuthCode] = useState('');
      const [accessToken, setAccessToken] = useState('');
      const [loading, setLoading] = useState(false);
      const [status, setStatus] = useState('');
      const [socketStatus, setSocketStatus] = useState('Desconectado');

      // Configuración de cTrader Open API OAuth
      const clientId = "37758_qrw6XXMCG8WVPK3oNpvpGKrrNtEX9BRKghzzKCT3NSxLCFk8Wb";
      const redirectUri = "https://antothiago1329-create.github.io/quantum-neon/";
      const authUrl = `https://id.ctrader.com/my/settings/openapi/grantingaccess/?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=trading&product=web`;

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if (code) {
          setAuthCode(code);
          setStatus('⚡ ¡Código de autorización detectado!');
        }
      }, []);

      const handleCanjearToken = async () => {
        if (!authCode) {
          setStatus('❌ Por favor inicia sesión primero para obtener el código.');
          return;
        }

        setLoading(true);
        setStatus('Connecting to Demo cTrader WebSocket...');

        try {
          // Conexión WebSocket al servidor Demo de cTrader
          const ws = new WebSocket("wss://demo.ctraderapi.com:5036");

          ws.onopen = () => {
            setSocketStatus('Conectado a Demo Server');
            setStatus('✅ Conexión establecida con el servidor Demo.');
            
            // Enviar solicitud de autenticación de aplicación
            const appAuthReq = {
              clientMsgId: "req_1",
              payloadType: 2100, // PROTO_OA_APPLICATION_AUTH_REQ
              clientSecret: "", // Se llena si se usa backend
              clientId: clientId
            };
            ws.send(JSON.stringify(appAuthReq));
          };

          ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log("Respuesta de cTrader Demo:", data);
            setStatus('✅ Respuesta recibida del servidor Demo.');
            setLoading(false);
          };

          ws.onerror = (err) => {
            console.error(err);
            setStatus('⚠️️ Error de WebSocket Demo. Verifica la configuración.');
            setLoading(false);
          };

          ws.onclose = () => {
            setSocketStatus('Desconectado');
          };

        } catch (err) {
          setStatus('❌ Error: ' + err.message);
          setLoading(false);
        }
      };

      return (
        <div class="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between">
          <header class="text-center my-4">
            <h1 class="text-2xl font-bold text-cyan-400 neon-glow">QUANTUM NEON TERMINAL</h1>
            <p class="text-xs text-slate-400 mt-1">Modo Demo — cTrader / Pepperstone</p>
          </header>

          <main class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <span class="text-cyan-400 font-semibold text-sm">cTrader Demo Account</span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">DEMO</span>
            </div>

            <div class="text-xs text-slate-300 space-y-1">
              <p>1) Inicia sesión para vincular tu cuenta Demo.</p>
              <p>2) Presiona el botón de canje para activar la conexión WebSocket Demo.</p>
            </div>

            <a
              href={authUrl}
              target="_self"
              class="block text-center w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg transition-colors cursor-pointer"
            >
              1. INICIAR SESIÓN CON CTRADER
            </a>

            <div class="space-y-2">
              <label class="block text-xs text-slate-400">CÓDIGO OAUTH</label>
              <input
                type="text"
                value={authCode}
                onChange={(e) => setAuthCode(e.target.value)}
                placeholder="El código aparecerá aquí automáticamente"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-cyan-300 focus:outline-none"
              />
            </div>

            <button
              onClick={handleCanjearToken}
              disabled={loading}
              class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold rounded-lg transition-colors"
            >
              {loading ? 'CONECTANDO...' : '2. CONECTAR A DEMO CTRADER'}
            </button>

            {status && (
              <div class={`p-3 rounded-lg text-xs font-mono ${status.includes('❌') || status.includes('⚠️') ? 'bg-red-950 text-red-400' : 'bg-slate-950 text-cyan-400'}`}>
                {status}
              </div>
            )}

            <div class="text-[10px] text-slate-500 flex justify-between">
              <span>Estado servidor:</span>
              <span class="text-emerald-400 font-mono">{socketStatus}</span>
            </div>
          </main>

          <footer class="mt-8 border-t border-slate-800 pt-3 flex justify-around text-[10px] text-slate-500">
            <button class="hover:text-cyan-400">INICIO</button>
            <button class="hover:text-cyan-400">GRÁFICO</button>
            <button class="hover:text-cyan-400">PRECIOS</button>
            <button class="hover:text-cyan-400">POSICIONES</button>
            <button class="hover:text-cyan-400">ANALISTA</button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
