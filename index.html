<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Neon Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .neon-glow {
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.5), 0 0 20px rgba(34, 211, 238, 0.3);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [authCode, setAuthCode] = useState('');
      const [loading, setLoading] = useState(false);
      const [status, setStatus] = useState('');

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if (code) {
          setAuthCode(code);
          setStatus('¡Código capturado automáticamente de la URL!');
        }
      }, []);

      const handleCodeChange = (e) => {
        setAuthCode(e.target.value);
      };

      const handleCanjearToken = async () => {
        if (!authCode) {
          setStatus('❌ Por favor ingresa o captura un código válido.');
          return;
        }
        setLoading(true);
        setStatus('Procesando token...');
        
        try {
          // Aquí va la lógica para intercambiar el código por token
          setTimeout(() => {
            setStatus('✅ Conexión realizada exitosamente.');
            setLoading(false);
          }, 1500);
        } catch (err) {
          setStatus('❌ Error al obtener el token: ' + err.message);
          setLoading(false);
        }
      };

      // URLs configuradas correctamente para OAuth cTrader
      const clientId = "37758_qrw6XXMCG8WVPK3oNpvpGKrrNtEX9BRKghzzKCT3NSxLCFk8Wb";
      const redirectUri = "https://antothiago1329-create.github.io/quantum-neon/";
      const authUrl = `https://id.ctrader.com/oauth/v2/auth?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=trading`;

      return (
        <div class="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between">
          <header class="text-center my-4">
            <h1 class="text-2xl font-bold text-cyan-400 neon-glow">QUANTUM NEON TERMINAL</h1>
            <p class="text-xs text-slate-400 mt-1">Conexión cTrader - Pepperstone</p>
          </header>

          <main class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
            <div class="flex items-center space-x-2 text-cyan-400 font-semibold border-b border-slate-800 pb-2">
              <span>cTrader - Pepperstone</span>
            </div>

            <div class="text-xs text-slate-300 space-y-1">
              <p>1) Iniciá sesión con tu cuenta cTrader/Pepperstone.</p>
              <p>2) Te va a redirigir a una URL con <code class="text-cyan-400">?code=...</code> — copiá ese código y pegalo abajo.</p>
              <p>3) Conectá.</p>
            </div>

            <a
              href={authUrl}
              target="_self"
              class="block text-center w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg transition-colors cursor-pointer"
            >
              1. INICIAR SESIÓN CON CTRADER
            </a>

            <div class="space-y-2">
              <label class="block text-xs text-slate-400">CÓDIGO (de la URL de redirección)</label>
              <input
                type="text"
                value={authCode}
                onChange={handleCodeChange}
                placeholder="pegá el código acá"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-cyan-300 focus:outline-none"
              />
            </div>

            <button
              onClick={handleCanjearToken}
              disabled={loading}
              class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold rounded-lg transition-colors"
            >
              {loading ? 'Procesando...' : '2. CANJEAR CÓDIGO POR TOKEN'}
            </button>

            {status && (
              <div class={`p-3 rounded-lg text-xs font-mono ${status.includes('❌') ? 'bg-red-950 text-red-400' : 'bg-slate-950 text-cyan-400'}`}>
                {status}
              </div>
            )}
          </main>

          <footer class="mt-8 border-t border-slate-800 pt-3 flex justify-around text-[10px] text-slate-500">
            <button class="hover:text-cyan-400">INICIO</button>
            <button class="hover:text-cyan-400">GRÁFICO</button>
            <button class="hover:text-cyan-400">PRECIOS</button>
            <button class="hover:text-cyan-400">POSICIONES</button>
            <button class="hover:text-cyan-400">ANALISTA</button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
