<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0c10" />
<title>Quantum — Smart Trading V24 · Mobile</title>

<style>
  /* ============ TOKENS ============ */
  :root{
    --q-bg:#0a0c10;
    --q-panel:#070914;
    --q-panel2:#0d1120;
    --q-border:rgba(148,163,184,.12);
    --q-border2:rgba(148,163,184,.18);
    --q-white:#eef2ff;
    --q-label:#7f8aa8;
    --q-dim:#4b5470;
    --q-up:#28e08b;
    --q-down:#ff5470;
    --q-yellow:#ffcc48;
    --q-purple:#7c5cff;
    --q-cyan:#27d7ff;
    --q-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --q-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  html,body,#root{height:100%;margin:0;background:var(--q-bg);overscroll-behavior:none;}
  body{-webkit-tap-highlight-color:transparent;font-family:var(--q-sans);color:var(--q-white);}
  *{box-sizing:border-box;}

  /* ============ SHELL ============ */
  .q-app{
    height:100%;display:flex;flex-direction:column;
    background:
      radial-gradient(circle at 50% -10%, rgba(124,92,255,.10), transparent 34%),
      var(--q-panel);
    min-height:0;
  }
  .q-body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}

  /* ============ HEADER ============ */
  .q-v8-screen{
    height:100%;display:flex;flex-direction:column;
    background:radial-gradient(circle at 50% -10%, rgba(124,92,255,.10), transparent 34%), var(--q-panel);
    color:var(--q-white);min-height:0;
  }
  .q-v8-head{
    padding:14px 14px 10px;border-bottom:1px solid var(--q-border);
    background:rgba(10,15,29,.82);backdrop-filter:blur(18px);
    position:sticky;top:0;z-index:3;
  }
  .q-v8-kicker{font:700 10px var(--q-mono);letter-spacing:1.5px;color:var(--q-label);text-transform:uppercase;}
  .q-v8-title{font:800 20px var(--q-sans);margin-top:3px;letter-spacing:-.4px;}
  .q-v8-sub{font:12px var(--q-sans);color:var(--q-label);margin-top:3px;}

  .q-v8-search{
    margin-top:11px;display:flex;gap:8px;align-items:center;
    background:var(--q-panel2);border:1px solid var(--q-border2);border-radius:14px;
    padding:0 12px;box-shadow:0 8px 30px rgba(0,0,0,.16);
  }
  .q-v8-search svg{flex:none;opacity:.55;}
  .q-v8-search input{
    flex:1;border:0;background:transparent;color:var(--q-white);
    padding:12px 0;font:14px var(--q-sans);outline:none;min-width:0;
  }
  .q-v8-search input::placeholder{color:var(--q-dim);}

  /* ============ TABS ============ */
  .q-v8-tabs{
    display:flex;gap:7px;overflow-x:auto;padding:10px 14px 8px;
    scrollbar-width:none;
  }
  .q-v8-tabs::-webkit-scrollbar{display:none;}
  .q-v8-tab{
    border:1px solid var(--q-border);background:var(--q-panel2);color:var(--q-label);
    border-radius:999px;padding:7px 11px;font:700 11px var(--q-mono);
    white-space:nowrap;cursor:pointer;transition:.16s ease;
  }
  .q-v8-tab:active{transform:scale(.96);}
  .q-v8-tab.active{
    background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.55);color:var(--q-white);
  }

  /* ============ WATCHLIST ============ */
  .q-v8-list{flex:1;overflow:auto;padding:2px 10px 18px;-webkit-overflow-scrolling:touch;}
  .q-v8-group{
    padding:9px 5px 7px;font:700 10px var(--q-mono);
    letter-spacing:1.3px;color:var(--q-label);text-transform:uppercase;
  }
  .q-v8-row{
    display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:11px 8px;margin-bottom:6px;
    background:linear-gradient(135deg, rgba(18,24,42,.96), rgba(13,17,32,.96));
    border:1px solid var(--q-border);border-radius:14px;transition:.16s ease;cursor:pointer;
  }
  .q-v8-row:active{transform:scale(.992);}
  .q-v8-star{
    width:28px;height:28px;border:0;background:transparent;color:var(--q-dim);
    font-size:17px;cursor:pointer;line-height:1;padding:0;transition:.16s ease;
  }
  .q-v8-star.on{color:var(--q-yellow);text-shadow:0 0 12px rgba(255,204,72,.45);}
  .q-v8-name{
    font:700 13px var(--q-sans);color:var(--q-white);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .q-v8-meta{font:10px var(--q-mono);color:var(--q-label);margin-top:2px;}
  .q-v8-price{text-align:right;font:800 13px var(--q-mono);color:var(--q-white);}
  .q-v8-change{font:700 11px var(--q-mono);margin-top:2px;}
  .q-v8-spark{width:74px;height:22px;margin-left:auto;margin-top:3px;display:block;}
  .up{color:var(--q-up);} .down{color:var(--q-down);}

  .q-empty{padding:40px 20px;text-align:center;color:var(--q-label);font:13px var(--q-sans);}

  /* ============ NEWS ============ */
  .q-news-feature{
    margin:12px 14px 8px;padding:16px;border-radius:18px;border:1px solid var(--q-border2);
    background:linear-gradient(145deg, rgba(124,92,255,.14), rgba(18,24,42,.94));
    box-shadow:0 14px 36px rgba(0,0,0,.18);
  }
  .q-news-card{
    margin:7px 14px;padding:13px;border:1px solid var(--q-border);background:var(--q-panel2);
    border-radius:15px;text-decoration:none;display:block;transition:.16s ease;color:inherit;cursor:pointer;
  }
  .q-news-card:active{transform:scale(.995);}
  .q-news-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;}
  .q-news-chip{font:800 9px var(--q-mono);padding:4px 7px;border-radius:999px;}
  .q-news-title{font:700 14px var(--q-sans);line-height:1.42;color:var(--q-white);}
  .q-news-meta{
    display:flex;justify-content:space-between;gap:8px;margin-top:8px;
    font:10px var(--q-mono);color:var(--q-label);
  }
  .q-news-feature .q-news-title{font-size:17px;line-height:1.35;}

  /* ============ AI ============ */
  .q-ai-hero{
    margin:14px;padding:16px;border-radius:20px;border:1px solid rgba(124,92,255,.32);
    background:
      radial-gradient(circle at 90% 0, rgba(39,215,255,.10), transparent 35%),
      linear-gradient(145deg, rgba(124,92,255,.15), rgba(13,17,32,.96));
    box-shadow:0 18px 42px rgba(0,0,0,.2);
  }
  .q-ai-badge{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid rgba(124,92,255,.4);background:rgba(124,92,255,.12);
    padding:5px 8px;border-radius:999px;font:800 10px var(--q-mono);color:var(--q-white);
  }
  .q-ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;}
  .q-ai-stat{padding:9px;border:1px solid var(--q-border);background:rgba(7,9,20,.32);border-radius:12px;}
  .q-ai-stat b{display:block;font:800 13px var(--q-mono);color:var(--q-white);margin-top:3px;}
  .q-ai-stat span{font:9px var(--q-mono);color:var(--q-label);letter-spacing:.06em;text-transform:uppercase;}

  .q-ai-suggestions{display:flex;gap:7px;overflow:auto;padding:0 14px 10px;scrollbar-width:none;}
  .q-ai-suggestions::-webkit-scrollbar{display:none;}
  .q-ai-suggestion{
    border:1px solid var(--q-border);background:var(--q-panel2);color:var(--q-label);
    border-radius:999px;padding:8px 10px;font:600 10px var(--q-sans);
    white-space:nowrap;cursor:pointer;transition:.16s ease;
  }
  .q-ai-suggestion:active{transform:scale(.96);}

  .q-chat{flex:1;overflow:auto;padding:4px 14px 12px;display:flex;flex-direction:column;gap:10px;}
  .q-bubble{
    max-width:84%;padding:11px 13px;border-radius:16px;font:13px/1.5 var(--q-sans);
    border:1px solid var(--q-border);background:var(--q-panel2);align-self:flex-start;
    white-space:pre-wrap;word-break:break-word;
  }
  .q-bubble.me{
    align-self:flex-end;background:rgba(124,92,255,.16);
    border-color:rgba(124,92,255,.42);
  }
  .q-chat-empty{padding:18px 14px;text-align:center;color:var(--q-label);}
  .q-chat-empty strong{display:block;color:var(--q-white);font:800 18px var(--q-sans);margin:9px 0 5px;}
  .q-chat-input{
    display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--q-border);
    background:rgba(10,15,29,.9);backdrop-filter:blur(14px);
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  .q-chat-input input{
    flex:1;border:1px solid var(--q-border2);background:var(--q-panel2);color:var(--q-white);
    border-radius:12px;padding:12px;font:13px var(--q-sans);outline:none;min-width:0;
  }
  .q-chat-input button{
    border:0;border-radius:12px;padding:0 16px;font:800 12px var(--q-sans);
    background:linear-gradient(135deg,var(--q-purple),var(--q-cyan));
    color:#fff;cursor:pointer;transition:.16s ease;
  }
  .q-chat-input button:active{transform:scale(.96);}
  .q-chat-input button:disabled{opacity:.4;}

  .q8-pulse{
    width:7px;height:7px;border-radius:50%;background:var(--q-up);
    box-shadow:0 0 0 5px rgba(40,224,139,.10);
    animation:q8pulse 1.8s ease-in-out infinite;
  }
  @keyframes q8pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.5;transform:scale(.82);}
  }

  /* ============ PORTFOLIO ============ */
  .q-port-hero{
    margin:14px;padding:18px;border-radius:22px;border:1px solid var(--q-border2);
    background:linear-gradient(145deg, rgba(18,24,42,.96), rgba(10,15,29,.86));
    box-shadow:0 18px 50px rgba(0,0,0,.2);
  }
  .q-port-label{font:700 10px var(--q-mono);letter-spacing:.14em;color:var(--q-label);text-transform:uppercase;}
  .q-port-total{font:800 30px var(--q-mono);margin-top:6px;letter-spacing:-1px;}
  .q-port-delta{font:700 12px var(--q-mono);margin-top:4px;}
  .q-pos{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:7px 14px;padding:13px;border:1px solid var(--q-border);
    background:var(--q-panel2);border-radius:15px;
  }
  .q-pos-l{min-width:0;}
  .q-pos-r{text-align:right;flex:none;}

  /* ============ BOTTOM NAV ============ */
  .q-nav{
    display:flex;border-top:1px solid var(--q-border);
    background:rgba(10,15,29,.94);backdrop-filter:blur(18px);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .q-nav button{
    flex:1;border:0;background:transparent;color:var(--q-dim);
    padding:11px 4px 12px;font:700 9px var(--q-mono);letter-spacing:.06em;
    display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
    transition:.16s ease;text-transform:uppercase;
  }
  .q-nav button.active{color:var(--q-white);}
  .q-nav button.active svg{filter:drop-shadow(0 0 8px rgba(124,92,255,.7));}
  .q-nav button:active{transform:scale(.94);}

  /* ============ V9 / QA18 (preservados) ============ */
  .q-v9-panel{
    min-height:100%;padding:18px;overflow:auto;
    background:
      radial-gradient(circle at 85% 0%, rgba(124,92,255,.09), transparent 34%),
      radial-gradient(circle at 10% 20%, rgba(39,215,255,.05), transparent 30%),
      var(--q-bg);
  }
  .q-v9-hero{
    padding:18px;border:1px solid var(--q-border);border-radius:22px;
    background:linear-gradient(145deg, rgba(18,24,42,.96), rgba(10,15,29,.86));
    box-shadow:0 18px 50px rgba(0,0,0,.2);margin-bottom:14px;
  }
  .q-v9-kicker{font:700 10px var(--q-mono);letter-spacing:.14em;color:var(--q-cyan);}
  .q-v9-title{font:800 24px var(--q-sans);margin-top:5px;color:var(--q-white);}
  .q-v9-sub{font:12px var(--q-sans);color:var(--q-label);margin-top:5px;}
  .q-v9-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px;}
  .q-v9-card{
    padding:14px;border:1px solid var(--q-border);border-radius:16px;background:rgba(13,17,32,.82);
  }
  .q-v9-card span{display:block;font:600 9px var(--q-mono);color:var(--q-label);letter-spacing:.08em;}
  .q-v9-card b{display:block;margin-top:6px;font:800 17px var(--q-mono);color:var(--q-white);}
  .q-v9-section{font:800 12px var(--q-mono);color:var(--q-white);letter-spacing:.06em;margin:18px 2px 9px;}

  .qa18-run{
    background:linear-gradient(135deg,var(--q-purple),var(--q-cyan));color:#fff;border:0;
    border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer;
    box-shadow:0 8px 30px rgba(39,215,255,.15);
  }
  .qa18-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .qa18-card{
    padding:13px;border:1px solid var(--q-border);background:rgba(18,24,42,.72);border-radius:14px;
  }
  .qa18-status{font-size:10px;text-transform:uppercase;letter-spacing:.08em;}
  .qa18-note{font-size:11px;color:var(--q-label);line-height:1.45;margin-top:7px;}

  @media(max-width:650px){
    .q-v9-panel{padding:14px 12px 20px;}
    .q-v9-grid{grid-template-columns:1fr 1fr;}
    .q-v9-title{font-size:22px;}
  }
  @media(max-width:390px){
    .q-v9-grid{grid-template-columns:1fr;}
    .q-v9-card{padding:11px;}
  }
  @media(max-width:800px){
    .qa18-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }

  /* Desktop centering */
  @media(min-width:900px){
    .q-app{max-width:480px;margin:0 auto;border-left:1px solid var(--q-border);border-right:1px solid var(--q-border);}
    .q-v8-list{padding-left:14px;padding-right:14px;}
    .q-news-card{max-width:920px;}
    .q-news-feature{max-width:920px;}
    .q-ai-hero{max-width:920px;}
    .q-ai-suggestions{max-width:920px;}
    .q-v8-search{max-width:920px;}
    .q-v8-head{padding-left:18px;}
  }
</style>
</head>

<script type="text/babel" data-presets="react">

/* ============================================================
   HELPERS
   ============================================================ */
const nf = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 0 });

const fmt = (n, decimals = 2) => {
  if (n >= 1000) return nf0.format(n);
  return n.toLocaleString('es-ES', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
};
const pct = (n) => `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`;
const cls = (n) => (n >= 0 ? 'up' : 'down');

function spark(seed, points = 24) {
  let s = seed;
  const rnd = () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
  let v = 50;
  const out = [];
  for (let i = 0; i < points; i++) {
    v += (rnd() - 0.48) * 12;
    v = Math.max(8, Math.min(92, v));
    out.push(v);
  }
  return out;
}

const NEWS = [
  {

  {

  {

  },
  {

    src: 'FT', time: 'hace 2 h',
  },
  {

];

const TONES = {
  purple: { bg: 'rgba(124,92,255,.18)', fg: '#b6a5ff' },

  green:  { bg: 'rgba(40,224,139,.16)', fg: '#6ff0b6' },
  yellow: { bg: 'rgba(255,204,72,.16)', fg: '#ffdd8a' },
  red:    { bg: 'rgba(255,84,112,.16)', fg: '#ff9aae' },
};

const POSITIONS = [
  { sym: 'BTC',  qty: 0.421, avg: 58230.10, price: 67421.35 },
  { sym: 'ETH',  qty: 3.150, avg: 2980.40,  price: 3284.10  },
  { sym: 'NVDA', qty: 42,    avg: 98.20,    price: 128.47   },
  { sym: 'AAPL', qty: 25,    avg: 210.75,   price: 228.91   },
  { sym: 'SOL',  qty: 18,    avg: 188.00,   price: 172.44   },
];

/* ============================================================
   COMPONENTES BASE
   ============================================================ */
function Spark({ data, color, w = 74, h = 22 }) {
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const step = w / (data.length - 1);

  const d = data
    .map((v, i) => {
      const x = i * step;
      const y = h - ((v - min) / range) * (h - 4) - 2;
      return `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`;
    })
    .join(' ');

  return (
    <svg className="q-v8-spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
      <path d={d} fill="none" stroke={color} strokeWidth="1.6"
            strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function AssetRow({ asset, isFav, onToggleFav }) {
  const pos = asset.chg >= 0;
  return (
    <div className="q-v8-row">
      <button
        className={`q-v8-star ${isFav ? 'on' : ''}`}
        onClick={(e) => { e.stopPropagation(); onToggleFav(asset.sym); }}
        aria-label={isFav ? 'Quitar de favoritos' : 'Añadir a favoritos'}
      >
        {isFav ? '★' : '☆'}
      </button>

      <div style={{ minWidth: 0 }}>
        <div className="q-v8-name">{asset.name}</div>
        <div className="q-v8-meta">{asset.sym} · {asset.cat}</div>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <Spark
          data={useMemo(() => spark(asset.seed), [asset.seed])}
          color={pos ? 'var(--q-up)' : 'var(--q-down)'}
        />
        <div>
          <div className="q-v8-price">
            {asset.price < 10 ? asset.price.toFixed(4) : fmt(asset.price)}
          </div>
          <div className={`q-v8-change ${cls(asset.chg)}`}>{pct(asset.chg)}</div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PANTALLA · MERCADOS
   ============================================================ */
function MarketsScreen({ favorites, toggleFav }) {
  const [tab, setTab] = useState('Todos');
  const [query, setQuery] = useState('');

  const list = useMemo(() => {
    let out = ASSETS;
    if (tab === 'Favoritos') out = out.filter((a) => favorites.includes(a.sym));
    else if (tab !== 'Todos') out = out.filter((a) => a.cat === tab);

    const q = query.trim().toLowerCase();
    if (q) {
      out = out.filter(
        (a) => a.name.toLowerCase().includes(q) || a.sym.toLowerCase().includes(q)
      );
    }
    return out;
  }, [tab, query, favorites]);

  const groups = useMemo(() => {
    const map = new Map();
    list.forEach((a) => {
      if (!map.has(a.cat)) map.set(a.cat, []);
      map.get(a.cat).push(a);
    });
    return Array.from(map.entries());
  }, [list]);

  const total = useMemo(
    () => ASSETS.reduce((acc, a) => acc + a.chg, 0) / ASSETS.length,
    []
  );

  return (
    <div className="q-v8-screen">
      <header className="q-v8-head">
        <div className="q-v8-kicker">Quantum · V24</div>
        <div className="q-v8-title">Mercados</div>
        <div className="q-v8-sub">
          {ASSETS.length} activos · media {pct(total)}
        </div>

        <div className="q-v8-search">
          <Icon.Search />
          <input
            type="search"
            placeholder="Buscar activo o símbolo…"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            aria-label="Buscar activo"
          />
        </div>
      </header>

      <div className="q-v8-tabs">
        {CATEGORIES.map((c) => (
          <button
            key={c}
            className={`q-v8-tab ${tab === c ? 'active' : ''}`}
            onClick={() => setTab(c)}
          >
            {c}
          </button>
        ))}
      </div>

      <div className="q-v8-list">
        {groups.length === 0 && (
          <div className="q-empty">Sin resultados para «{query}»</div>
        )}

        {groups.map(([cat, items]) => (
          <React.Fragment key={cat}>
            <div className="q-v8-group">{cat}</div>
            {items.map((a) => (
              <AssetRow
                key={a.sym}
                asset={a}
                isFav={favorites.includes(a.sym)}
                onToggleFav={toggleFav}
              />
            ))}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   PANTALLA · NOTICIAS
   ============================================================ */
function NewsScreen() {
  const [filter, setFilter] = useState('Todas');
  const cats = ['Todas', ...Array.from(new Set(NEWS.map((n) => n.cat)))];

  const featured = NEWS.find((n) => n.featured) || NEWS[0];
  const rest = NEWS.filter((n) => n.id !== featured.id);
  const list =
    filter === 'Todas' ? rest : rest.filter((n) => n.cat === filter);

  const Chip = ({ tone, children }) => {
    const t = TONES[tone] || TONES.purple;
    return (
      <span className="q-news-chip" style={{ background: t.bg, color: t.fg }}>
        {children}
      </span>
    );
  };

  return (
    <div className="q-v8-screen">
      <header className="q-v8-head">
        <div className="q-v8-kicker">Quantum · Feed</div>
        <div className="q-v8-title">Noticias</div>
        <div className="q-v8-sub">Actualizado hace 2 minutos</div>
      </header>

      <div className="q-v8-tabs">
        {cats.map((c) => (
          <button
            key={c}
            className={`q-v8-tab ${filter === c ? 'active' : ''}`}
            onClick={() => setFilter(c)}
          >
            {c}
          </button>
        ))}
      </div>

      <div className="q-v8-list">
        {filter === 'Todas' && (
          <article className="q-news-feature">
            <div className="q-news-top">
              <Chip tone={featured.tone}>{featured.cat}</Chip>
              <Chip tone="cyan">DESTACADA</Chip>
            </div>
            <div className="q-news-title">{featured.title}</div>
            <div className="q-news-meta">
              <span>{featured.src}</span>
              <span>{featured.time}</span>
            </div>
          </article>
        )}

        {list.map((n) => (
          <article key={n.id} className="q-news-card">
            <div className="q-news-top">
              <Chip tone={n.tone}>{n.cat}</Chip>
            </div>
            <div className="q-news-title">{n.title}</div>
            <div className="q-news-meta">
              <span>{n.src}</span>
              <span>{n.time}</span>
            </div>
          </article>
        ))}

        {list.length === 0 && (
          <div className="q-empty">No hay noticias en esta categoría.</div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   PANTALLA · QUANTUM AI
   ============================================================ */
const SUGGESTIONS = [
  '¿Cómo está el mercado hoy?',
  'Analiza BTC',
  'Dame una idea de trading',
  '¿Qué riesgo tengo en cartera?',
];

function AiScreen() {
  const [messages, setMessages] = useState([]);
  const [draft, setDraft] = useState('');
  const [typing, setTyping] = useState(false);
  const endRef = useRef(null);

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, typing]);

  const answer = useCallback((text) => {
    const t = text.toLowerCase();

    if (t.includes('btc') || t.includes('bitcoin')) {
      return 'BTC cotiza en 67.421 $ con +2,41 % en 24 h.\n\n' +
        '• Tendencia: alcista de corto plazo.\n' +
        '• Soporte clave: 64.800 $\n' +
        '• Resistencia: 69.500 $\n\n' +
        'Si el precio cierra por encima de 69.500 $ con volumen, ' +
        'el siguiente objetivo se sitúa en 72.000 $.';
    }
    if (t.includes('mercado') || t.includes('hoy')) {
      return 'Resumen de sesión:\n\n' +
        '• Sesgo general: ligeramente alcista.\n' +
        '• Mejor comportamiento: Tecnología (+3,87 % en NVDA).\n' +
        '• Peor comportamiento: Energía (-1,80 %).\n' +
        '• Volatilidad: media.\n\n' +
        'La media de tus 14 activos está en ' + pct(0.41) + '.';
    }
    if (t.includes('riesgo') || t.includes('cartera')) {
      return 'Análisis de riesgo de tu cartera:\n\n' +
        '• Exposición a cripto: 58 %\n' +
        '• Exposición a renta variable: 42 %\n' +
        '• Concentración máxima: BTC (31 %)\n\n' +
        'Recomendación: diversificar hacia ETFs defensivos ' +
        'para reducir la beta agregada de la cartera.';
    }
    if (t.includes('idea') || t.includes('trading') || t.includes('trade')) {
      return 'Idea de trading (solo informativa, no es asesoramiento):\n\n' +
        'Activo: EUR/USD\n' +
        'Escenario: continuación alcista por encima de 1,0870.\n' +
        'Stop sugerido: 1,0842\n' +
        'Objetivo: 1,0935\n' +
        'Ratio riesgo/beneficio: ≈ 2,3';
    }
    if (t.includes('eth') || t.includes('ethereum')) {
      return 'ETH cotiza en 3.284,10 $ con +1,18 % en 24 h.\n\n' +
        '• Relación con BTC: estable.\n' +
        '• Zona de acumulación: 3.100 – 3.200 $\n' +
        '• Objetivo de corto plazo: 3.480 $';
    }
    return 'Entendido. Estoy analizando «' + text + '».\n\n' +
      'Puedo darte contexto de mercado, análisis técnico de un activo, ' +
      'resumen de noticias relevantes o una revisión de riesgo de tu cartera. ' +
      '¿Sobre cuál de ellos quieres profundizar?';
  }, []);

  const send = useCallback((text) => {
    const value = (text ?? draft).trim();
    if (!value || typing) return;

    setMessages((m) => [...m, { id: Date.now(), who: 'me', text: value }]);
    setDraft('');
    setTyping(true);

    setTimeout(() => {
      setMessages((m) => [
        ...m,
        { id: Date.now() + 1, who: 'ai', text: answer(value) },
      ]);
      setTyping(false);
    }, 650);
  }, [draft, typing, answer]);

  return (
    <div className="q-v8-screen">
      <header className="q-v8-head">
        <div className="q-v8-kicker">Quantum · Motor IA</div>
        <div className="q-v8-title">Asistente</div>
        <div className="q-v8-sub" style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span className="q8-pulse" />
          Modelo activo · latencia 42 ms
        </div>
      </header>

      <div className="q-ai-hero">
        <span className="q-ai-badge">
          <span className="q8-pulse" /> QUANTUM CORE v24
        </span>
        <div className="q-ai-grid">
          <div className="q-ai-stat"><span>Precisión</span><b>94,2 %</b></div>
          <div className="q-ai-stat"><span>Señales</span><b>1.284</b></div>
          <div className="q-ai-stat"><span>Latencia</span><b>42 ms</b></div>
        </div>
      </div>

      <div className="q-ai-suggestions">
        {SUGGESTIONS.map((s) => (
          <button key={s} className="q-ai-suggestion" onClick={() => send(s)}>
            {s}
          </button>
        ))}
      </div>

      <div className="q-chat">
        {messages.length === 0 && !typing && (
          <div className="q-chat-empty">
            <div style={{ fontSize: 30 }}>◈</div>
            <strong>¿En qué te ayudo?</strong>
            Pregúntame por un activo, por el estado del mercado<br />o por el riesgo de tu cartera.
          </div>
        )}

        {messages.map((m) => (
          <div key={m.id} className={`q-bubble ${m.who === 'me' ? 'me' : ''}`}>
            {m.text}
          </div>
        ))}

        {typing && <div className="q-bubble">Analizando…</div>}
        <div ref={endRef} />
      </div>

      <form
        className="q-chat-input"
        onSubmit={(e) => { e.preventDefault(); send(); }}
      >
        <input
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          placeholder="Escribe tu consulta…"
          aria-label="Mensaje"
        />
        <button type="submit" disabled={!draft.trim() || typing}>Enviar</button>
      </form>
    </div>
  );
}

/* ============================================================
   PANTALLA · CARTERA
   ============================================================ */
function PortfolioScreen() {
  const rows = POSITIONS.map((p) => {
    const asset = ASSETS.find((a) => a.sym === p.sym) || { name: p.sym, cat: '—' };
    const value = p.qty * p.price;
    const cost = p.qty * p.avg;
    const pl = value - cost;
    const plPct = (pl / cost) * 100;
    return { ...p, name: asset.name, cat: asset.cat, value, cost, pl, plPct };
  });

  const totalValue = rows.reduce((a, r) => a + r.value, 0);
  const totalCost = rows.reduce((a, r) => a + r.cost, 0);
  const totalPl = totalValue - totalCost;
  const totalPct = (totalPl / totalCost) * 100;

  return (
    <div className="q-v8-screen">
      <header className="q-v8-head">
        <div className="q-v8-kicker">Quantum · Cartera</div>
        <div className="q-v8-title">Portafolio</div>
        <div className="q-v8-sub">{rows.length} posiciones abiertas</div>
      </header>

      <div className="q-v8-list">
        <div className="q-port-hero">
          <div className="q-port-label">Valor total</div>
          <div className="q-port-total">{fmt(totalValue)} $</div>
          <div className={`q-port-delta ${cls(totalPl)}`}>
            {totalPl >= 0 ? '+' : ''}{fmt(totalPl)} $ · {pct(totalPct)}
          </div>
        </div>

        <div className="q-v8-group">Posiciones</div>

        {rows.map((r) => (
          <div key={r.sym} className="q-pos">
            <div className="q-pos-l">
              <div className="q-v8-name">{r.name}</div>
              <div className="q-v8-meta">
                {r.qty} × {fmt(r.avg)} $ · {r.cat}
              </div>
            </div>
            <div className="q-pos-r">
              <div className="q-v8-price">{fmt(r.value)} $</div>
              <div className={`q-v8-change ${cls(r.plPct)}`}>{pct(r.plPct)}</div>
            </div>
          </div>
        ))}

        <div className="q-v8-group">Métricas</div>
        <div className="qa18-grid" style={{ padding: '0 4px 18px' }}>
          <div className="qa18-card">
            <div className="qa18-status" style={{ color: 'var(--q-label)' }}>Coste</div>
            <b style={{ font: '800 15px var(--q-mono)' }}>{fmt(totalCost)} $</b>
          </div>
          <div className="qa18-card">
            <div className="qa18-status" style={{ color: 'var(--q-label)' }}>PnL</div>
            <b style={{ font: '800 15px var(--q-mono)', color: totalPl >= 0 ? 'var(--q-up)' : 'var(--q-down)' }}>
              {fmt(totalPl)} $
            </b>
          </div>
          <div className="qa18-card">
            <div className="qa18-status" style={{ color: 'var(--q-label)' }}>Rentab.</div>
            <b style={{ font: '800 15px var(--q-mono)', color: totalPl >= 0 ? 'var(--q-up)' : 'var(--q-down)' }}>
              {pct(totalPct)}
            </b>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
const NAV = [
  { id: 'markets',   label: 'Mercados', icon: Icon.Markets },
  { id: 'news',      label: 'Noticias', icon: Icon.News },
  { id: 'ai',        label: 'IA',       icon: Icon.Spark },
  { id: 'portfolio', label: 'Cartera',  icon: Icon.Wallet },
];

function App() {
  const [screen, setScreen] = useState('markets');
  const [favorites, setFavorites] = useState(['BTC', 'NVDA', 'ETH']);

  const toggleFav = useCallback((sym) => {
    setFavorites((f) =>
      f.includes(sym) ? f.filter((s) => s !== sym) : [...f, sym]
    );
  }, []);

  return (
    <div className="q-app">
      <div className="q-body">
        {screen === 'markets' && (
          <MarketsScreen favorites={favorites} toggleFav={toggleFav} />
        )}
        {screen === 'news' && <NewsScreen />}
        {screen === 'ai' && <AiScreen />}
        {screen === 'portfolio' && <PortfolioScreen />}
      </div>

      <nav className="q-nav">
        {NAV.map((n) => {
          const I = n.icon;
          return (
            <button
              key={n.id}
              className={screen === n.id ? 'active' : ''}
              onClick={() => setScreen(n.id)}
              aria-label={n.label}
              aria-current={screen === n.id ? 'page' : undefined}
            >
              <I />
              {n.label}
            </button>
          );
        })}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
