    if (this.outputRef.current) {
      this.outputRef.current.scrollTop = this.outputRef.current.scrollHeight;
    }
  }

  handleInputChange(e) {
    this.setState({ input: e.target.value });
  }

  handleKeyDown(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      this.executeCommand();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      this.navigateHistory(-1);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      this.navigateHistory(1);
    }
  }

  navigateHistory(direction) {
    const { history, historyIndex } = this.state;
    if (history.length === 0) return;
    let newIndex = historyIndex + direction;
    if (newIndex < -1) newIndex = -1;
    if (newIndex >= history.length) newIndex = history.length - 1;
    this.setState({
      historyIndex: newIndex,
      input: newIndex >= 0 ? history[newIndex] : ''
    });
  }

  executeCommand() {
    const { input, history } = this.state;
    if (input.trim() === '') {
      this.setState({ input: '' });
      return;
    }
    const newHistory = [...history, input];
    this.setState({
      history: newHistory,
      historyIndex: newHistory.length,
      input: ''
    });
    this.processCommand(input);
  }

  processCommand(cmd) {
    const parts = cmd.trim().split(/\s+/);
    const command = parts[0].toLowerCase();
    const args = parts.slice(1);
    const output = this.state.output.slice();
    output.push({
      type: 'input',
      content: \`\${this.state.prompt} \${cmd}\`
    });
    if (this.commands[command]) {
      try {
        const result = this.commands[command](args);
        if (result !== undefined && result !== null) {
          if (Array.isArray(result)) {
            result.forEach(line => {
              output.push({ type: 'output', content: line });
            });
          } else if (typeof result === 'string') {
            output.push({ type: 'output', content: result });
          } else if (typeof result === 'object') {
            output.push({ type: 'output', content: JSON.stringify(result, null, 2) });
          }
        }
      } catch (e) {
        output.push({ type: 'error', content: \`Error: \${e.message}\` });
      }
    } else {
      output.push({ type: 'error', content: \`Command not found: \${command}\` });
    }
    this.setState({ output });
  }

  matrix(args) {
    if (this.matrixInterval) {
      clearInterval(this.matrixInterval);
      this.matrixInterval = null;
      return 'Matrix stopped.';
    }
    const chars = '01';
    let output = 'Matrix mode activated...\n';
    let matrixData = Array(80).fill(0);
    this.matrixInterval = setInterval(() => {
      let line = '';
      for (let i = 0; i < 80; i++) {
        if (Math.random() < 0.1) matrixData[i] = Math.random() < 0.5 ? 1 : 0;
        if (Math.random() < 0.05) matrixData[i] = 0;
        line += matrixData[i] ? chars[Math.floor(Math.random() * chars.length)] : ' ';
      }
      const { output: currentOutput } = this.state;

  snake(args) {
    if (this.snakeInterval) {
      clearInterval(this.snakeInterval);
      this.snakeInterval = null;
      return 'Snake stopped.';
    }
    let snake = [{x: 10, y: 10}];
    let dir = {x: 1, y: 0};
    let food = {x: 15, y: 10};
    let score = 0;
    let gameOver = false;
    const width = 40;
    const height = 20;
    let output = 'Snake game started...\n';

    this.snakeInterval = setInterval(() => {
      if (gameOver) {
        clearInterval(this.snakeInterval);
        this.snakeInterval = null;
        return;
      }
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      if (head.x < 0 || head.x >= width || head.y < 0 || head.y >= height ||
          snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver = true;
        this.setState(prev => ({
          output: [...prev.output, { type: 'output', content: \`Snake game over! Score: \${score}\` }]
        }));
        clearInterval(this.snakeInterval);
        this.snakeInterval = null;
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        food = {x: Math.floor(Math.random() * width), y: Math.floor(Math.random() * height)};
      } else {
        snake.pop();
      }
      let board = [];
      for (let y = 0; y < height; y++) {
        let row = '';
        for (let x = 0; x < width; x++) {
          if (snake.some(seg => seg.x === x && seg.y === y)) row += '█';
          else if (x === food.x && y === food.y) row += '●';
          else row += ' ';
        }
        board.push(row);
      }
      board.push(\`Score: \${score}\`);
      const { output: currentOutput } = this.state;
      if (currentOutput.length > 200) {
        currentOutput.splice(0, 20);
      }
      currentOutput.push({ type: 'game', content: board.join('\\n') });
      this.setState({ output: currentOutput });
      this.scrollToBottom();
    }, 150);
    return output;
  }

  tictactoe(args) {
    let board = [
      [' ', ' ', ' '],
      [' ', ' ', ' '],
      [' ', ' ', ' ']
    ];
    let turn = 'X';
    let moves = 0;
    let gameOver = false;
    let output = 'Tic Tac Toe started!\n';
    const renderBoard = () => {
      return board.map(row => '|' + row.join('|') + '|').join('\\n') + '\\n';
    };
    output += renderBoard();
    // Simple AI for demo
    const aiMove = () => {
      const empty = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          if (board[r][c] === ' ') empty.push({r, c});
        }
      }
      if (empty.length === 0) return null;
      return empty[Math.floor(Math.random() * empty.length)];
    };
    this.tictactoeInterval = setInterval(() => {
      if (gameOver) {
        clearInterval(this.tictactoeInterval);
        this.tictactoeInterval = null;
        return;
      }
      if (turn === 'X') {
        const move = aiMove();
        if (!move) { gameOver = true; return; }
        board[move.r][move.c] = 'X';
        moves++;
        turn = 'O';
        // Check win
        const win = this.checkWin(board, 'X');
        if (win) {
          gameOver = true;
          this.setState(prev => ({
            output: [...prev.output, { type: 'output', content: 'X wins!\\n' + renderBoard() }]
          }));
          clearInterval(this.tictactoeInterval);
          this.tictactoeInterval = null;
          return;
        }
        if (moves === 9) {
          gameOver = true;
          this.setState(prev => ({
            output: [...prev.output, { type: 'output', content: 'Draw!\\n' + renderBoard() }]
          }));
          clearInterval(this.tictactoeInterval);
          this.tictactoeInterval = null;
          return;
        }
      } else {
        const move = aiMove();
        if (!move) { gameOver = true; return; }
        board[move.r][move.c] = 'O';
        moves++;
        turn = 'X';
        const win = this.checkWin(board, 'O');
        if (win) {
          gameOver = true;
          this.setState(prev => ({
            output: [...prev.output, { type: 'output', content: 'O wins!\\n' + renderBoard() }]
          }));
          clearInterval(this.tictactoeInterval);
          this.tictactoeInterval = null;
          return;
        }
        if (moves === 9) {
          gameOver = true;
          this.setState(prev => ({
            output: [...prev.output, { type: 'output', content: 'Draw!\\n' + renderBoard() }]
          }));
          clearInterval(this.tictactoeInterval);
          this.tictactoeInterval = null;
          return;
        }
      }
      this.setState(prev => ({
        output: [...prev.output, { type: 'game', content: renderBoard() }]
      }));
      this.scrollToBottom();
    }, 500);
    return output;
  }

  checkWin(board, player) {
    for (let r = 0; r < 3; r++) {
      if (board[r][0] === player && board[r][1] === player && board[r][2] === player) return true;
      if (board[0][r] === player && board[1][r] === player && board[2][r] === player) return true;
    }
    if (board[0][0] === player && board[1][1] === player && board[2][2] === player) return true;
    if (board[0][2] === player && board[1][1] === player && board[2][0] === player) return true;
    return false;
  }

  rps(args) {
    const choices = ['rock', 'paper', 'scissors'];
    const player = args[0]?.toLowerCase();
    if (!player || !choices.includes(player)) {
      return 'Usage: rps <rock|paper|scissors>';
    }
    const comp = choices[Math.floor(Math.random() * choices.length)];
    let result;
    if (player === comp) result = 'Draw!';
    else if ((player === 'rock' && comp === 'scissors') ||
             (player === 'paper' && comp === 'rock') ||
             (player === 'scissors' && comp === 'paper')) {
      result = 'You win!';
    } else {
      result = 'You lose!';
    }
    return \`You chose \${player}, computer chose \${comp}. \${result}\`;

    const max = parseInt(args[1]) || 100;
    if (min >= max) return 'min must be less than max.';
    return \`Random: \${Math.floor(Math.random() * (max - min + 1)) + min}\`;
  }

  calc(args) {
    const expr = args.join(' ');
    if (!expr) return 'Usage: calc <expression>';
    try {
      const result = eval(expr);
      return \`\${expr} = \${result}\`;
    } catch (e) {
      return \`Error: \${e.message}\`;
    }
  }

          value={input}
          onChange={this.handleInputChange.bind(this)}
          onKeyDown={this.handleKeyDown.bind(this)}
          style={{
            position: 'absolute',
            opacity: 0,
            width: 1,
            height: 1,
            pointerEvents: 'none',
            zIndex: -1,
          }}
          autoFocus
          spellCheck={false}
          autoComplete="off"
        />

        {/* Status bar */}
        <div style={{
          borderTop: '1px solid ' + style.border,
          padding: '4px 0 0 0',
          marginTop: '4px',
          display: 'flex',
          justifyContent: 'space-between',
          fontSize: isMobile ? '8px' : '10px',
          opacity: 0.5,
          flexShrink: 0,
        }}>
          <span>⚡ {output.length} lines</span>
          <span>⌨️ {input.length} chars</span>
          <span>🔄 v18.3</span>
        </div>
      </div>
    );
  }
}

// ============================================================
// Renderizado de la aplicación
// ============================================================

ReactDOM.render(<App />, document.getElementById('root'));
`;
