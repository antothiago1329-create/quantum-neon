<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Neon Terminal</title>
  
  <!-- Consola de depuración móvil Eruda -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- React 18 y Babel CDN (Ejecuta JSX sin necesidad de Vite/npm) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS para los estilos de la interfaz -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background-color: #0b0f17; color: #e2e8f0; font-family: monospace; }
    .neon-glow { text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff; }
  </style>
</head>
<body class="bg-gray-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [authCode, setAuthCode] = useState('');
      const [status, setStatus] = useState('');
      const [loading, setLoading] = useState(false);

      // Auto-extrae el código ?code= de la URL si cTrader redirige a la app
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (code) {
          setAuthCode(code);
          setStatus('✓ Código detectado automáticamente de la URL');
        }
      }, []);

      // Limpia automáticamente la entrada si pegas la URL completa con 'code='
      const handleCodeChange = (e) => {
        let val = e.target.value.trim();
        if (val.includes('code=')) {
          val = val.split('code=')[1].split('&')[0];
        }
        setAuthCode(val);
      };

      const handleCanjearToken = async () => {
        if (!authCode) {
          setStatus('⚠️ Por favor, ingresa o pega un código válido.');
          return;
        }
        setLoading(true);
        setStatus('Procesando token con cTrader...');

        try {
          // AQUÍ SE PONE LA PETICIÓN A LA API DE CTRADER
          // Ejemplo de estructura de llamado:
          /*
          const res = await fetch('URL_DE_TU_PROXY_O_API', {
            method: 'POST',
            body: JSON.stringify({ code: authCode })
          });
          */
          setStatus('✓ ¡Conexión realizada exitosamente!');
        } catch (err) {
          setStatus('❌ Error al obtener el token: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="max-w-md mx-auto p-4 flex flex-col min-h-screen justify-between">
          {/* Encabezado Neon */}
          <header class="text-center my-4">
            <h1 class="text-2xl font-bold text-cyan-400 neon-glow">QUANTUM NEON TERMINAL</h1>
            <p class="text-xs text-slate-400 mt-1">Conexión cTrader - Pepperstone</p>
          </header>

          {/* Panel Principal cTrader */}
          <main class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
            <div class="flex items-center space-x-2 text-cyan-400 font-semibold border-b border-slate-800 pb-2">
              <span>🔌</span>
              <span>CTRADER – Pepperstone</span>
            </div>

            <div class="text-xs text-slate-300 space-y-1">
              <p>1) Iniciá sesión con tu cuenta cTrader/Pepperstone.</p>
              <p>2) Te va a redirigir a una URL con <code class="text-cyan-400">?code=...</code> — copiá ese código y pegalo abajo.</p>
              <p>3) Conectá.</p>
            </div>

            <a 
              href="https://id.ctrader.com/my/settings/openapi" 
              target="_blank"
              class="block text-center w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-lg transition shadow-md"
            >
              1. INICIAR SESIÓN CON CTRADER
            </a>

            <div class="space-y-2">
              <label class="block text-xs text-slate-400">CÓDIGO (de la URL de redirección)</label>
              <input 
                type="text" 
                value={authCode}
                onChange={handleCodeChange}
                placeholder="pegá el código acá" 
                class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-cyan-300 focus:outline-none focus:border-cyan-500 font-mono"
              />
            </div>

            <button 
              onClick={handleCanjearToken}
              disabled={loading}
              class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold rounded-lg transition active:scale-95"
            >
              {loading ? 'Procesando...' : '2. CANJEAR CÓDIGO POR TOKEN'}
            </button>

            {status && (
              <div class={`p-3 rounded-lg text-xs font-mono ${status.includes('❌') || status.includes('⚠️') ? 'bg-red-950/50 border border-red-800 text-red-300' : 'bg-slate-950 border border-cyan-900 text-cyan-300'}`}>
                {status}
              </div>
            )}
          </main>

          {/* Menú inferior */}
          <footer class="mt-6 border-t border-slate-800 pt-3 flex justify-around text-[10px] text-slate-500">
            <button class="hover:text-cyan-400">INICIO</button>
            <button class="hover:text-cyan-400">GRÁFICO</button>
            <button class="hover:text-cyan-400">PRECIOS</button>
            <button class="hover:text-cyan-400">POSICIONES</button>
            <button class="hover:text-cyan-400">ANALISTA</button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
